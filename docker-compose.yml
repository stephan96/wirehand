# wirehand: SSH-backed device analysis & change tool for Open WebUI and Onyx,
# with automatic containerlab discovery.
#
# Runs with network_mode: host so it can reach the containerlab management bridge
# (172.20.20.0/24 by default) - Docker isolates user-defined bridges from each other,
# so a normal bridged container could NOT reach the lab nodes.
# Front-ends on other machines use http://<this-host>:8110.
#
# Build with the host user's uid/gid so bind-mounted 600-files are readable:
#   docker compose build --build-arg APP_UID=$(id -u) --build-arg APP_GID=$(id -g)
# (not as a 'UID=... GID=... docker compose' prefix: bash/zsh mark UID read-only, and
#  compose would silently fall back to the 1000 defaults below)
# UVICORN workers MUST stay at 1: pending change codes and the SSH pool are in-process.

services:
  wirehand:
    build:
      context: .
      args:
        APP_UID: "${UID:-1000}"
        APP_GID: "${GID:-1000}"
    image: wirehand:0.6.2
    container_name: wirehand
    restart: unless-stopped
    network_mode: host
    mem_limit: 1g
    env_file:
      - .env                        # WIREHAND_API_KEY, WIREHAND_CLAB_DIR, manual device creds (chmod 600)
    environment:
      WIREHAND_INVENTORY: /app/config/inventory.yaml
      WIREHAND_PLATFORMS: /app/config/platforms       # per-device_type facts, commit/rollback, prompts, clab kinds; read at startup
      WIREHAND_SAFETY_RULES: /app/config/safety       # read-path rules: common.yaml + one file per device_type; a broken file stops startup
      WIREHAND_SAFETY_RESCAN: "30"    # seconds between checks for edits in config/safety/
      WIREHAND_CLAB_DIR: /clab        # container-side path of the containerlab folder (mounted below)
      WIREHAND_CLAB_RESCAN: "30"      # seconds between checks for deployed/destroyed labs
      WIREHAND_DATA: /app/data
      WIREHAND_IDLE_SECONDS: "300"
      # Timeouts, seconds - see "Timeouts and unknown outcomes" in the README.
      # Set them in .env to change them; the value after :- is the default.
      # Keep every per-step limit below its deadline, and the front-end's tool timeout above it.
      WIREHAND_DEADLINE_READ: "${WIREHAND_DEADLINE_READ:-60}"            # whole run_read / get_facts call
      WIREHAND_DEADLINE_PROPOSE: "${WIREHAND_DEADLINE_PROPOSE:-60}"      # whole propose_change / rollback_change call
      WIREHAND_DEADLINE_CONFIRM: "${WIREHAND_DEADLINE_CONFIRM:-60}"      # whole confirm_change call -> 504 OUTCOME UNKNOWN
      WIREHAND_LOCK_WAIT: "${WIREHAND_LOCK_WAIT:-20}"                    # wait for another call on the same device -> 409
      WIREHAND_CMD_TIMEOUT: "${WIREHAND_CMD_TIMEOUT:-45}"                # one read command
      WIREHAND_CHANGE_CMD_TIMEOUT: "${WIREHAND_CHANGE_CMD_TIMEOUT:-45}"  # one change step (command, config lines, commit)
      WIREHAND_CHANGE_TTL: "600"
      # Snapshot cleanup per device (startup, after every snapshot, daily) - see "Audit log & snapshots".
      # 0 switches a rule off. The snapshot of the last applied change is never removed.
      WIREHAND_SNAPSHOT_KEEP: "${WIREHAND_SNAPSHOT_KEEP:-20}"                      # max snapshots per device
      WIREHAND_SNAPSHOT_MAX_AGE_DAYS: "${WIREHAND_SNAPSHOT_MAX_AGE_DAYS:-90}"      # max age of any snapshot
      WIREHAND_SNAPSHOT_UNAPPLIED_DAYS: "${WIREHAND_SNAPSHOT_UNAPPLIED_DAYS:-7}"  # max age if the change was never applied
      WIREHAND_CHECK_TIMEOUT: "2"      # seconds per device for list_devices(check=true)
      WIREHAND_SESSION_LOG: "0"        # "1" = write per-device session logs to /app/data (debugging)
      WIREHAND_MAX_OUTPUT_CHARS: "80000"   # ~20k tokens
      WIREHAND_CORS_ORIGINS: "*"           # tighten to e.g. "http://<webui-host>:3000" once it works
    volumes:
      - ./config:/app/config:ro
      - ${WIREHAND_CLAB_DIR:-./clab-empty}:/clab:ro   # host path from .env, e.g. /home/<user>/containerlabs
      - wirehand_data:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  wirehand_data:
