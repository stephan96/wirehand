# wirehand platform definition for device_type: cisco_xr (Cisco IOS-XR)
# Format: see common.yaml.

version: 1
name: Cisco IOS-XR

# get_facts: the overview bundle, the intended first step of an analysis.
facts:
  - show version
  - show ipv4 interface brief
  - show route summary
  - show bgp summary
  - show lldp neighbors
  - show logging last 30

# Saved before every change and before a native rollback.
snapshot: show running-config

session:
  enable: false
  prep: []

change:
  apply: config_set
  finish: commit
  rollback_last:
    - rollback configuration last 1
  balance_end: false
  # Closing lines models like to add. The tool leaves config mode itself, and on
  # a committing platform leaving with uncommitted changes makes the device ask
  # first - so a trailing end/exit is dropped (the preview says so).
  drop_trailing:
    - '^exit$'
  # ... and 'end' anywhere else is refused: it leaves config mode with the change
  # uncommitted, XR asks whether to commit, and the session hangs at the question.
  last_line_only:
    - '^end$'
  # Matched against every line of a config change. The CLI accepts any
  # unambiguous abbreviation, so a verb is its shortest distinctive prefix plus
  # [a-z]*; '(\s|$)' keeps config words that merely start the same way
  # (config-register, wrr-queue, end-policy) out of it.
  refuse_in_config:
    reason: the tool enters and leaves config mode and commits/saves itself, and exec commands do not belong in a config change - use mode='exec' for maintenance commands
    patterns:
      - '^conf[a-z]*(\s|$)'           # conf t, config, configure
      - '^com(m(it?)?)?(\s|$)'        # commit (not 'comment')
      - '^wr[a-z]*(\s|$)'             # wr, write
      - '^relo[a-z]*(\s|$)'           # reload
      - '^reb[a-z]*(\s|$)'            # reboot
      - '^do(\s|$)'                   # 'do <cmd>' runs an exec command from config mode
      - '^abort(\s|$)'                # discards the change and leaves config mode

containerlab:
  kinds:
    cisco_xrd: {username: clab, password: clab@123}
    cisco_xrv9k: {username: clab, password: clab@123}
    cisco_xrv: {}
