# wirehand platform definition for device_type: huawei (Huawei VRP5)
# Format: see common.yaml.

version: 1
name: Huawei VRP5

facts:
  - display version
  - display ip interface brief
  - display ip routing-table statistics
  - display lldp neighbor brief

snapshot: display current-configuration

session:
  enable: false
  # Huawei VRP asks for confirmation on maintenance commands ("Continue? [Y/N]:");
  # mmi-mode is the vendor's own switch for exactly this case - it tells the CLI a
  # machine is typing, and the questions stop. Best effort: if the image does not
  # know the command, nothing breaks.
  prep:
    - mmi-mode enable

change:
  apply: config_set
  finish: save
  rollback_last: null
  balance_end: false
  # Closing lines models like to add. The tool leaves config mode itself, and on
  # a committing platform leaving with uncommitted changes makes the device ask
  # first - so a trailing return/quit is dropped (the preview says so).
  drop_trailing:
    - '^quit$'
  # ... and 'return' anywhere else is refused: it would leave system-view with
  # the change uncommitted.
  last_line_only:
    - '^return$'
  # Matched against every line of a change made in system-view. 'quit' and
  # 'return' only leave a view, so they are allowed.
  refuse_in_config:
    reason: the tool enters and leaves system-view and commits/saves itself, and user-view commands do not belong in a config change - use mode='exec' for maintenance commands
    patterns:
      - '^run(\s|$)'                  # 'run <cmd>' runs a user-view command from system-view
      - '^com(m(it?)?)?(\s|$)'        # commit
      - '^sa(ve?)?(\s|$)'             # save
      - '^reb[a-z]*(\s|$)'            # reboot

# No containerlab kind: clab's huawei_vrp is VRP8 (huawei_vrpv8.yaml). Map it here
# per lab with 'containerlab.kinds' in inventory.yaml if you run VRP5 images.
