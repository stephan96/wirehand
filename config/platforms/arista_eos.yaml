# wirehand platform definition for device_type: arista_eos (Arista EOS)
# Format: see common.yaml.

version: 1
name: Arista EOS

facts:
  - show version
  - show ip interface brief
  - show ip route summary
  - show lldp neighbors

snapshot: show running-config

session:
  enable: true
  prep: []

change:
  apply: config_set
  finish: save
  rollback_last: null
  balance_end: false
  # Matched against every line of a config change. The CLI accepts any
  # unambiguous abbreviation, so a verb is its shortest distinctive prefix plus
  # [a-z]*; '(\s|$)' keeps config words that merely start the same way
  # (config-register, wrr-queue, end-policy) out of it.
  refuse_in_config:
    reason: the tool enters and leaves config mode and commits/saves itself, and exec commands do not belong in a config change - use mode='exec' for maintenance commands
    patterns:
      - '^conf[a-z]*(\s|$)'           # conf t, config, configure
      - '^end(\s|$)'                  # leaves config mode: later lines would run in exec mode
      - '^com(m(it?)?)?(\s|$)'        # commit (not 'comment')
      - '^wr[a-z]*(\s|$)'             # wr, write
      - '^relo[a-z]*(\s|$)'           # reload
      - '^reb[a-z]*(\s|$)'            # reboot
      - '^do(\s|$)'                   # 'do <cmd>' runs an exec command from config mode
      # NX-OS (and EOS) accept exec commands typed in config mode, without 'do'.
      - '^cop[a-z]*(\s|$)'            # copy
      - '^dele[a-z]*(\s|$)'           # delete (not 'delay')

containerlab:
  kinds:
    arista_ceos: {username: admin, password: admin}
    arista_veos: {}
