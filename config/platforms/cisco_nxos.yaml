# wirehand platform definition for device_type: cisco_nxos (Cisco NX-OS)
# Format: see common.yaml.

version: 1
name: Cisco NX-OS

facts:
  - show version
  - show interface brief
  - show ip route summary
  - show cdp neighbors

snapshot: show running-config

session:
  enable: true
  prep: []

change:
  apply: config_set
  finish: save
  rollback_last: null
  balance_end: false
  refuse_in_config:
    reason: the tool handles mode changes and commit
    patterns:
      - '^(commit|end|configure|conf|write|reload|reboot)(\s|$)'

containerlab:
  kinds:
    cisco_n9kv: {}
