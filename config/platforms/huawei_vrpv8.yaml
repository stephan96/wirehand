# wirehand platform definition for device_type: huawei_vrpv8 (Huawei VRP8: NE40E, CE)
# Format: see common.yaml.

version: 1
name: Huawei VRP8

facts:
  - display version
  - display ip interface brief
  - display ip routing-table statistics
  - display bgp peer
  - display lldp neighbor brief
  - display logbuffer size 30

snapshot: display current-configuration

session:
  enable: false
  # See huawei.yaml: stops the "Continue? [Y/N]:" questions on maintenance commands.
  prep:
    - mmi-mode enable

change:
  apply: config_set
  finish: commit
  rollback_last:
    - rollback configuration last 1
  balance_end: false
  # Closing lines models like to add. The tool leaves config mode itself, and on
  # a committing platform leaving with uncommitted changes makes the device ask
  # first - so a trailing return/quit is dropped (the preview says so).
  drop_trailing:
    - '^quit$'
  # ... and 'return' anywhere else is refused: it leaves system-view with the
  # change uncommitted, VRP8 asks whether to commit, and the session hangs.
  last_line_only:
    - '^return$'
  # mmi-mode does not fall back to the parent view: after 'interface X', a line
  # 'interface Y' is rejected until 'quit' leaves X.
  # - Indented change (the layout of 'display current-configuration'):
  #   propose_change inserts the missing 'quit' lines, the preview marks them.
  # - Any change: a line the device rejects with one of retry_on while the prompt
  #   shows a sub-view is sent again after 'quit', up to system-view - what VRP
  #   does by itself outside mmi-mode. The device decides where a line belongs,
  #   wirehand needs no list of the commands that open a view.
  close_views:
    command: quit
    retry_on:
      - 'Unrecognized command'
    # group 1 = the view: '[~vrp3]' -> vrp3, '[*vrp3-LoopBack1]' -> vrp3-LoopBack1
    view_prompt: '^\[[~*]?(.+)\]$'
  # How the device says it rejected a line ("Error: ...", "Error[1]: Unrecognized
  # command found at '^' position."). Matched line by line; the command echo
  # starts with the prompt, so a description containing "Error:" does not match.
  config_errors:
    patterns:
      - '^\s*Error(\[\d+\])?:'
    # Throws the uncommitted candidate away and returns to system-view; the prompt
    # then shows '~' (nothing uncommitted) instead of '*'. Verified on NE40E V800R023.
    discard:
      - clear configuration candidate
    dirty_prompt: '^\[\*'
    hint: >-
      A line the device does not know inside a sub-view is already sent again
      after leaving the view with 'quit', so this line was rejected in
      system-view as well (or rejected for another reason). Check its syntax and
      the view it belongs to with run_read, e.g. 'display current-configuration
      interface X'.
  # Matched against every line of a change made in system-view. 'quit' and
  # 'return' only leave a view, so they are allowed.
  refuse_in_config:
    reason: the tool enters and leaves system-view and commits/saves itself, and user-view commands do not belong in a config change - use mode='exec' for maintenance commands
    patterns:
      - '^run(\s|$)'                  # 'run <cmd>' runs a user-view command from system-view
      - '^com(m(it?)?)?(\s|$)'        # commit
      - '^sa(ve?)?(\s|$)'             # save
      - '^reb[a-z]*(\s|$)'            # reboot

containerlab:
  kinds:
    huawei_vrp: {username: admin, password: admin}
