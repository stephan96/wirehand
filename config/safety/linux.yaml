# wirehand read-path safety rules for device_type: linux
#
# Applied together with common.yaml (and local/common.yaml, local/linux.yaml if
# present). Format, evaluation order and editing rules: see common.yaml.

version: 1

# A Linux CLI is a general-purpose shell, so anything that is not on the
# allow-list is refused (deny by default): a Linux host has thousands of
# binaries, and a blocklist only ever names the ones somebody thought of -
# 'touch', 'cp', 'ln -s', 'wget' and every future one would otherwise pass.
default: deny


# --- 1. Hard refusals -------------------------------------------------------
# The allow-list matches the VERB, so an allow-listed verb carrying the wrong
# ARGUMENT would otherwise slip through and write: `find ... -delete`,
# `ethtool -s`, `journalctl --vacuum`. These argument-level checks run first.
hard_refusals:
  - pattern: '^(ip|ifconfig)\s+(?!.*\bshow\b).*\b(add|del|set|flush|replace|change)\b'
    reason: mutating ip/ifconfig subcommand - use propose_change

  - pattern: '^ip\b.*(\s-(b|ba\w*|fo\w*)\b|\b(netns|vrf)\s+exec\b)'
    reason: "'ip -batch/-force' or 'ip netns|vrf exec' runs arbitrary commands - use propose_change"
    note: >
      -batch reads ip commands (writes included) from a file; 'netns exec' and
      'vrf exec' start any program.

  - pattern: '^bridge\b.*\b(add|del|delete|replace|set|append|flush|change)\b'
    reason: mutating bridge subcommand - use propose_change

  - pattern: '^arp\b.*\s(-[a-z]*[dsf]\b|--delete|--set|--file)'
    reason: "'arp -d/-s/-f' changes the ARP table - use propose_change"

  - pattern: '^sysctl\b.*(\s-[a-z]*[wpf]\b|\s--(write|load|system)\b|\s[^-\s]\S*=)'
    reason: "'sysctl' with -w/-p/--system or key=value changes kernel settings - use propose_change"
    note: >
      procps-ng sysctl writes a 'key=value' argument even without -w, and -p /
      --system load whole files of settings.

  - pattern: '^sort\b.*(\s-[a-z]*o|\s--output|\s--compress-program)'
    reason: "'sort -o' writes a file and --compress-program runs one - use propose_change"

  - pattern: '^uniq\b(\s+(-\S*[fsw]\s+\S+|-\S*[^\sfsw]))*\s+[^-\s]\S*\s+[^-\s]\S*'
    reason: "'uniq IN OUT' writes its second file argument - use propose_change"

  - pattern: '^(xargs|nohup|timeout|watch|nice|ionice|setsid|stdbuf|script|chroot|unshare|nsenter)\b'
    reason: command wrapper can hide a write command - use propose_change

  - pattern: '^env\s+\S'
    reason: "'env' with arguments can hide a write command - use propose_change"

  - pattern: '^find\b.*\s-(delete|exec|execdir|ok|okdir|fls|fprintf?|fprint0)\b'
    reason: "'find' with an action that writes or executes - use propose_change"

  - pattern: '^journalctl\b.*--(vacuum|rotate|flush|sync|relinquish-var|smart-relinquish-var|setup-keys|update-catalog|cursor-file)'
    reason: "'journalctl' with a maintenance option deletes, rotates or writes journal files - use propose_change"

  - pattern: '^(mount|umount)\s+(?!-l\b)\S'
    reason: (un)mounting changes the system - use propose_change

  - pattern: '^date\b.*\s(-s|--set)\b|^date\s+(-u\s+|--utc\s+|--universal\s+)?\d'
    reason: "'date -s' / 'date MMDDhhmm' sets the system clock - use propose_change"

  - pattern: '^hostname\s+(?!-)\S'
    reason: "'hostname <name>' sets the hostname - use propose_change"

  - pattern: '^(clab|containerlab)\s+graph\b'
    reason: "'containerlab graph' starts a web server or writes a file - use propose_change"

  # Case-SENSITIVE entries: the rest of this file is matched case-insensitively,
  # which cannot tell 'ethtool -S' (statistics) from 'ethtool -s' (set!), or
  # 'ss -k' from 'ss -K'.
  - pattern: '^ethtool\s+(-s|-A|-C|-G|-K|-L|-N|-U|-W|-E|-X|-f|-r|-t|-p|--change\S*|--flash|--set\S*|--config\S*|--reset|--test|--identify|--pause|--coalesce|--ring|--offload|--features|--negotiate|--per-queue)\b'
    reason: "'ethtool' with a setting, reset or self-test flag - use propose_change"
    case_sensitive: true

  - pattern: '^ss\b.*\s-K\b'
    reason: "'ss -K' closes live sockets - use propose_change"
    case_sensitive: true

  - pattern: '^dmesg\b.*(\s-[a-zA-Z]*[CcnDE]|\s--(clear|read-clear|console-level|console-off|console-on)\b)'
    reason: "'dmesg' with -C/-c/-n/-D/-E clears the ring buffer or changes console logging - use propose_change"
    case_sensitive: true

  - pattern: '^hostname\b.*\s(-F|--file|-b|--boot)\b'
    reason: "'hostname -F/-b' sets the hostname - use propose_change"
    case_sensitive: true

  - pattern: '^(ip6?tables|iptables-legacy|ip6tables-legacy)\b.*(\s-[a-zA-Z]*[ADIRFZNXPE]|\s--(append|delete|insert|replace|flush|zero|new-chain|delete-chain|policy|rename-chain)\b)'
    reason: "'iptables' with a rule-changing command (-A/-D/-I/-F/-Z/...) - use propose_change"
    case_sensitive: true
    note: >
      '-L -Z' lists AND zeroes the counters; only -L/-S with their options are reads.

  - pattern: '^rpm\b.*--(setperms|setugids|setcaps|restore|import|initdb|rebuilddb|install|upgrade|erase|freshen|reinstall|addsign|resign|delsign)\b'
    reason: "'rpm' with a modifying option - use propose_change"

  - pattern: '^less\b.*\s(-[a-zA-Z]*[oO]|--log-file|--LOG-FILE)'
    reason: "'less -o' copies its input to a file - use propose_change"
    case_sensitive: true

  - pattern: '^file\b.*\s(-[a-zA-Z]*C|--compile)'
    reason: "'file -C' writes a compiled magic file - use propose_change"
    case_sensitive: true


# --- 2. Write blocklist -----------------------------------------------------
# With 'default: deny' these would be refused anyway; listing them gives the
# model a precise reason instead of "not on the allow-list", and keeps them
# refused should an allow-list entry ever be written too broadly.
blocklist:
  - group: power
    patterns:
      - '^(reboot|shutdown|halt|poweroff|init\s+[06])'

  - group: filesystem-writes
    patterns:
      - '^(rm|mv|dd|mkfs|fdisk|parted|shred|truncate)(\s|$)'
      - '^(chmod|chown|chgrp)\s'
      - '^(touch|cp|ln|mkdir|rmdir|install|tar|unzip|gzip|gunzip|bzip2|xz|setfacl|patch)(\s|$)'

  - group: service-management
    patterns:
      - '^(systemctl|service)\s+(start|stop|restart|reload|enable|disable|mask)'

  - group: package-managers
    patterns:
      - '^(apt|apt-get|dnf|yum|pip|pip3|snap|apk)\s+(install|remove|purge|upgrade|autoremove|add|del|fix)'

  - group: users-and-privileges
    patterns:
      - '^(useradd|userdel|usermod|passwd|groupadd|groupdel|visudo)'
      - '^(sudo|su|doas)\s+'   # no privilege escalation on the read path

  - group: firewall-writes
    patterns:
      - '^(iptables|nft|ufw|firewall-cmd)\s+(?!-L|-S|list|status|show)'

  - group: interface-writes
    patterns:
      # '... show up' / '... show down' are reads; only a mutating subcommand is a write.
      - '^(ip|ifconfig)\s+(?!.*\bshow\b).*\b(add|del|set|flush|up|down)\b'

  - group: processes-and-shell-plumbing
    patterns:
      - '^(kill|killall|pkill)\s'
      - '^(crontab\s+-[er]|tee\s|sed\s+-i|\S+\s*>\s*\S)'
      - '(\|\s*(sh|bash|python\d?|perl|xargs)\b)'

  - group: containers-and-labs
    patterns:
      - '^(docker|podman|kubectl)\s+(run|exec|rm|rmi|kill|stop|start|restart|create|build|pull|push|cp|login|update|prune|compose\s+(up|down|restart))'
      - '^(clab|containerlab)\s+(deploy|destroy|redeploy|exec|save|tools|generate)'


# --- 3. Read allow-list -----------------------------------------------------
# The ONLY way a command gets through on a Linux device, so adding a verb here
# grants it to every Linux device - check that none of its arguments can write
# before you do, and add a hard_refusal if some of them can.
#
# Note the two spellings: a pattern ending in '\s' requires an argument, one
# ending in '(\s|$)' also matches the bare verb ('^(ls)(\s|$)').
allowlist:
  - group: files-and-text
    patterns:
      - '^(cat|less|head|tail|grep|egrep|zgrep|find|ls|stat|wc|sort|uniq|cut)(\s|$)'
      - '^(readlink|realpath|file|md5sum|sha\d+sum)(\s|$)'

  - group: filesystem-and-resources
    patterns:
      - '^(df|du|free|lsblk|mount|nproc)(\s|$)'

  - group: host-identity-and-uptime
    patterns:
      - '^(uptime|w|who|id|hostname|uname|lsb_release|date|env|getent)(\s|$)'

  - group: processes
    patterns:
      - '^(ps|lsof)(\s|$)'
      - '^(top\s+-bn1)(\s|$)'

  - group: hardware-kernel-and-logs
    patterns:
      - '^(lscpu|lspci|lsusb|lsmod|dmesg|journalctl)(\s|$)'
      - '^(vmstat|iostat|mpstat)(\s|$)'
      - '^(sysctl\s+(?!-w)\S*)(\s|$)'

  - group: networking
    patterns:
      - '^(ss|netstat|arp|traceroute)(\s|$)'
      # The object is required: a bare option such as '-s' must not satisfy the
      # pattern, or 'ip -s netns exec ...' would pass as 'ip -s'.
      - '^(ip\s+(-\S+\s+)*(addr\w*|a|link|l|route|r|ro|neigh\w*|n|rule|ru))(\s|$)'
      - '^(bridge\s+(link|fdb|vlan))(\s|$)'
      - '^(ethtool)(\s|$)'

  - group: name-resolution-and-reachability
    patterns:
      - '^(dig|nslookup|host)(\s|$)'
      - '^(ping\s+-c\s*\d+)(\s|$)'
      - '^(mtr\s+-r)(\s|$)'

  - group: firewall-read
    patterns:
      - '^(iptables\s+-[LS])(\s|$)'
      - '^(nft\s+list)(\s|$)'
      - '^(ufw\s+status)(\s|$)'

  - group: services-read
    patterns:
      - '^(systemctl\s+(status|list-units|list-timers|is-active|is-enabled|show|cat))(\s|$)'

  - group: packages-read
    patterns:
      - '^(dpkg\s+-[lLs])(\s|$)'
      - '^(rpm\s+-q\S*)(\s|$)'
      - '^(apk\s+(info|list|version))(\s|$)'
      - '^(pip\d?\s+(list|show|freeze))(\s|$)'
      - '^(snap\s+list)(\s|$)'

  - group: containers-and-labs-read
    patterns:
      - '^(docker\s+(ps|images|logs|inspect|version|stats\s+--no-stream|compose\s+ps))(\s|$)'
      - '^((clab|containerlab)\s+(inspect|version))(\s|$)'
