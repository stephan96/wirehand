# wirehand read-path safety rules for device_type: fortinet (FortiGate / FortiOS)
#
# Applied together with common.yaml (and local/common.yaml, local/fortinet.yaml if
# present). Format, evaluation order and editing rules: see common.yaml.

version: 1

# A network CLI's exec view cannot start arbitrary programs, and vendor read
# verbs are far too varied to enumerate, so whatever survives hard_refusals and
# the blocklist is allowed. Set 'deny' to make this platform allow-list only -
# then the allowlist below is ALL that runs, so extend it first.
default: allow


# --- 1. Hard refusals -------------------------------------------------------
hard_refusals:
  - pattern: '^fnsysctl\b'
    reason: vendor shell escape - use propose_change
    note: >
      'fnsysctl' runs shell utilities on the FortiOS file system.

  - pattern: '^(execute|exec)\s+(?!ping6?\b|traceroute\b|tracert\b|dns\b|date\b|time\b)'
    reason: FortiGate 'execute' command - use propose_change(mode='exec')
    note: >
      'execute' is FortiOS's maintenance verb (reboot, backup, factoryreset,
      ...); only its diagnostics stay on the read path.


# --- 2. Write blocklist -----------------------------------------------------
# Known write/privileged/disruptive verbs, refused on run_read regardless of the
# device's access level. A group may set its own `reason`, otherwise the generic
# blocklist message is used.
blocklist:
  - group: config-mode-and-commit
    patterns:
      - '^(conf|configure)(\s|$)'
      - '^(commit|rollback|reload|reboot|shutdown)'
      - '^(save|startup)'

  - group: save-and-copy-config
    patterns:
      - '^(write|wr)(\s|$)'
      - '^copy\s'

  - group: vendor-mutating-verbs
    patterns:
      - '^(delete|erase|format)\s'
      - '^(clear|reset)\s'
      - '^(debug|undebug|terminal\s+monitor)'

  - group: fortinet-execute
    patterns:
      - '^(execute|exec)\s+(reboot|shutdown|factoryreset|restore|backup|formatlogdisk)'


# --- 3. Read allow-list -----------------------------------------------------
# With 'default: allow' this list decides nothing: a command that survives the
# blocklist runs anyway. It documents the read verbs and is what takes over when
# 'default' is switched to deny.
allowlist:
  - group: read-verbs
    patterns:
      - '^get\s'
      - '^show\s'
      - '^diagnose\s+(?!sys\s+kill)'
      - '^(execute|exec)\s+(ping6?|traceroute|tracert)\s'
